server:
  port: 8080

spring:
  application:
    name: findmyhome-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/findmyhome}
    username: ${SPRING_DATASOURCE_USERNAME:adityasinghbhadouria}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
